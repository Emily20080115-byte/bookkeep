<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小錢包記帳</title>
<meta name="theme-color" content="#FAF6ED">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小錢包">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #FAF6ED;
    --card: #FFFFFF;
    --ink: #2F3E5C;
    --muted: #8A8F9C;
    --line: #3E5A8C;
    --blue: #9DB4E0;
    --blue-soft: #DCE5F5;
    --orange: #F2A365;
    --orange-deep: #E5814F;
    --gold: #E9B65C;
    --silver: #D9D6D0;
    --income: #4E8E6E;
    --expense: #D9664A;
    --radius: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  body { min-height: 100vh; padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 110px); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 0 16px; }

  /* 開啟畫面：跟圖示一樣的錢包 */
  #splash { position: fixed; inset: 0; z-index: 99; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity .5s ease, visibility .5s; }
  #splash img { width: min(78vw, 360px); animation: float 1.6s ease-in-out infinite; }
  #splash h1 { position: relative; margin: 6px 0 0; font-size: 26px; letter-spacing: 4px; color: var(--line); }
  #splash p { margin: 8px 0 0; color: var(--muted); font-size: 14px; letter-spacing: 2px; }
  #splash.hide { opacity: 0; visibility: hidden; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }

  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 10px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 19px; color: var(--line); }
  .brand img { width: 38px; height: 38px; border-radius: 11px; box-shadow: 0 2px 6px rgba(62,90,140,.15); }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
    background: var(--card); box-shadow: 0 1px 4px rgba(62,90,140,.12); font-size: 18px; }

  .month { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 4px 0 14px; font-weight: 600; }
  .month button { width: 32px; height: 32px; border-radius: 50%; font-size: 18px; color: var(--line); background: var(--blue-soft); }

  /* 錢包造型的總覽卡 */
  .wallet { position: relative; background: var(--blue); border: 2.5px solid var(--line); border-radius: var(--radius);
    padding: 20px 20px 18px; color: #fff; overflow: hidden; }
  .wallet::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 14px; background: var(--orange); border-bottom: 2.5px solid var(--line); }
  .wallet .clasp { position: absolute; right: -2px; top: 50%; transform: translateY(-50%); width: 46px; height: 34px;
    background: var(--blue); border: 2.5px solid var(--line); border-right: 0; border-radius: 18px 0 0 18px; }
  .wallet .clasp::after { content: ""; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    width: 12px; height: 12px; border-radius: 50%; background: var(--orange); border: 2px solid var(--line); }
  .wallet .label { margin-top: 10px; font-size: 13px; opacity: .9; color: var(--ink); }
  .wallet .balance { font-size: 36px; font-weight: 800; color: var(--ink); margin: 2px 0 14px; letter-spacing: .5px; }
  .pocket { display: flex; gap: 10px; margin-right: 40px; }
  .pocket div { flex: 1; background: var(--orange); border: 2px solid var(--line); border-radius: 14px; padding: 9px 12px; color: var(--ink); }
  .pocket small { font-size: 12px; display: block; opacity: .85; }
  .pocket b { font-size: 17px; }

  h2 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 24px 4px 10px; }
  .panel { background: var(--card); border-radius: var(--radius); padding: 14px 16px; box-shadow: 0 1px 6px rgba(62,90,140,.08); }

  .cat-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .cat-row .emo { width: 30px; display: grid; place-items: center; color: var(--line); }
  .cat-row .emo svg { width: 22px; height: 22px; }
  .cat-row .name { width: 52px; font-size: 14px; }
  .bar { flex: 1; height: 10px; background: var(--blue-soft); border-radius: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--orange); border-radius: 6px; }
  .cat-row .amt { width: 82px; text-align: right; font-size: 14px; font-variant-numeric: tabular-nums; }

  .day { margin-bottom: 12px; }
  .day-head { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 0 6px 6px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid #F1ECE2; width: 100%; text-align: left; }
  .item:last-child { border-bottom: 0; }
  .coin { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--line);
    background: #FBE7C8; border: 2px solid var(--gold); }
  .item.in .coin { background: #E2EDE4; border-color: #9BC3A9; }
  .item .info { flex: 1; min-width: 0; }
  .item .info b { font-weight: 600; font-size: 15px; display: block; }
  .item .info small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .item .money { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--expense); }
  .item.in .money { color: var(--income); }

  .empty { text-align: center; color: var(--muted); padding: 26px 0 14px; font-size: 14px; }
  .empty img { width: 120px; opacity: .85; display: block; margin: 0 auto 6px; }

  /* 金幣新增按鈕 */
  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 24px);
    width: 68px; height: 68px; border-radius: 50%; background: var(--gold); border: 3px solid #C8923A;
    box-shadow: 0 6px 16px rgba(201,146,58,.4), inset 0 0 0 5px #F3CF86; font-size: 34px; color: #8A5A16; font-weight: 700; z-index: 10; }
  .fab:active { transform: translateX(-50%) scale(.94); }

  .coin svg { width: 22px; height: 22px; }

  /* ── 記一筆：整頁 ── */
  .add { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform .3s ease; visibility: hidden; }
  .add.open { transform: none; visibility: visible; }
  .add > * { width: 100%; }
  .topbar, .cats { padding-left: max(14px, calc(50% - 280px)) !important; padding-right: max(14px, calc(50% - 280px)) !important; }
  .entry > *, .keys-area > * { max-width: 560px; margin-left: auto; margin-right: auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: calc(env(safe-area-inset-top) + 10px) 14px 10px; border-bottom: 1px solid #ECE5D8; }
  .topbar .tb { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: var(--ink); }
  .topbar .tb svg { width: 24px; height: 24px; }
  .topbar .tb.trash { color: var(--expense); }
  .seg { display: flex; border: 2.5px solid var(--ink); border-radius: 14px; padding: 3px; background: #fff; }
  .seg button { width: 88px; padding: 6px 0; border-radius: 10px; font-weight: 700; font-size: 17px; letter-spacing: 2px; }
  .seg button.on { background: var(--orange); }

  .cats { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(4, 1fr); align-content: start;
    gap: 4px 0; padding: 14px 10px; -webkit-overflow-scrolling: touch; }
  .cats button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; font-size: 14px; color: var(--ink); }
  .ic { position: relative; width: 40px; height: 40px; display: grid; place-items: center; }
  .ic svg { position: relative; width: 34px; height: 34px; }
  .ic::before { content: ""; position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--orange); transform: scale(0); transition: transform .15s; }
  .on .ic::before, .ic.dot::before { transform: scale(1); }
  .cats button.on { font-weight: 700; }

  /* 下方輸入區 */
  .entry { border-top: 2.5px solid var(--ink); background: #fff; }
  .amt-row { display: flex; align-items: center; min-height: 66px; padding: 6px 14px; gap: 10px; }
  .amt-row .ic svg { width: 30px; height: 30px; }
  .amt-box { flex: 0 0 46%; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .amt-box .expr { font-size: 13px; color: var(--muted); min-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .amt-box b { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .amt-row .divider { width: 1.5px; align-self: stretch; background: #E4DDD0; margin: 4px 0; }
  .amt-row input { flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 17px; color: var(--ink); background: none; padding: 8px 0; }
  .amt-row input::placeholder { color: #B5B2AB; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 14px 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; background: #F1ECE2; border-radius: 16px; padding: 6px 14px; font-size: 14px; max-width: 200px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .keys-area { background: #F7CFA3; border-top: 2.5px solid var(--ink); padding: 12px 12px calc(env(safe-area-inset-bottom) + 14px); }
  .datebar { position: relative; display: flex; align-items: center; justify-content: space-between; background: #fff;
    border: 2.5px solid var(--ink); border-radius: 26px; height: 46px; margin-bottom: 12px; }
  .datebar .arrow { width: 50px; height: 100%; display: grid; place-items: center; position: relative; z-index: 2; }
  .datebar .arrow svg { width: 22px; height: 22px; }
  .datebar .label { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
  .datebar .label svg { width: 22px; height: 22px; }
  .datebar input[type=date] { position: absolute; left: 50px; right: 50px; top: 0; bottom: 0; opacity: 0; width: calc(100% - 100px);
    height: 100%; z-index: 1; -webkit-appearance: none; appearance: none; }
  .pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
  .pad button { height: clamp(50px, 7.6vh, 68px); border-radius: 999px; background: #fff; border: 2.5px solid var(--ink);
    font-size: 24px; font-weight: 600; color: var(--ink); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .pad button svg { width: 24px; height: 24px; vertical-align: middle; }
  .pad .op { background: var(--blue); color: #fff; font-size: 27px; }
  .pad .ok { grid-row: span 2; height: auto; background: var(--orange-deep); color: #fff; font-size: 24px; letter-spacing: 1px; }
  .pad button:active { filter: brightness(.9); transform: scale(.95); }

  .menu { position: absolute; right: 16px; top: 62px; background: #fff; border-radius: 16px; box-shadow: 0 6px 20px rgba(62,90,140,.18);
    padding: 6px; z-index: 25; display: none; min-width: 150px; }
  .menu.show { display: block; }
  .menu button { display: block; width: 100%; text-align: left; padding: 11px 12px; border-radius: 10px; font-size: 14px; }
  .menu button:active { background: var(--blue-soft); }
  .toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 70px); transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 9px 18px; border-radius: 20px; font-size: 14px; opacity: 0; transition: .3s; pointer-events: none; z-index: 60; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="splash">
  <img src="icons/icon-512.png" alt="">
  <h1>小錢包記帳</h1>
  <p>每一枚硬幣都算數</p>
</div>

<div class="wrap" style="position:relative">
  <header>
    <div class="brand"><img src="icons/icon-192.png" alt="">小錢包</div>
    <button class="icon-btn" id="menuBtn" aria-label="選單">⋯</button>
  </header>
  <div class="menu" id="menu">
    <button id="exportBtn">匯出備份</button>
    <button id="importBtn">匯入備份</button>
    <button disabled style="color:var(--muted);font-size:12px">版本 4</button>
    <button id="clearBtn" style="color:var(--expense)">清除全部資料</button>
  </div>
  <input type="file" id="importFile" accept="application/json" hidden>

  <div class="month">
    <button id="prev" aria-label="上個月">‹</button>
    <span id="monthLabel"></span>
    <button id="next" aria-label="下個月">›</button>
  </div>

  <div class="wallet">
    <div class="clasp"></div>
    <div class="label">本月結餘</div>
    <div class="balance" id="balance">$0</div>
    <div class="pocket">
      <div><small>收入</small><b id="incomeSum">$0</b></div>
      <div><small>支出</small><b id="expenseSum">$0</b></div>
    </div>
  </div>

  <h2>支出分類</h2>
  <div class="panel" id="catPanel"></div>

  <h2>明細</h2>
  <div id="list"></div>
</div>

<button class="fab" id="addBtn" aria-label="記一筆">＋</button>

<!-- 記一筆 -->
<section class="add" id="add" aria-hidden="true">
  <div class="topbar">
    <button class="tb" id="backBtn" aria-label="返回"></button>
    <div class="seg" id="seg">
      <button data-t="out" class="on">支出</button>
      <button data-t="in">收入</button>
    </div>
    <button class="tb trash" id="delBtn" aria-label="刪除" style="visibility:hidden"></button>
  </div>

  <div class="cats" id="cats"></div>

  <div class="entry">
    <div class="amt-row">
      <span class="ic dot" id="selIc"></span>
      <div class="amt-box">
        <div class="expr" id="expr"></div>
        <b id="amt">$0</b>
      </div>
      <span class="divider"></span>
      <input id="note" type="text" placeholder="輸入備註" maxlength="40" enterkeyhint="done">
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="keys-area">
    <div class="datebar">
      <button class="arrow" id="dayPrev" aria-label="前一天"></button>
      <span class="label" id="dateLabel"></span>
      <input type="date" id="date" aria-label="選擇日期">
      <button class="arrow" id="dayNext" aria-label="後一天"></button>
    </div>
    <div class="pad" id="pad">
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button class="op" data-k="÷">÷</button><button class="op" data-k="AC">AC</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button class="op" data-k="×">×</button><button class="op" data-k="back" aria-label="退格" id="backKey"></button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button class="op" data-k="+">+</button><button class="ok" data-k="ok">OK</button>
      <button data-k="00">00</button><button data-k="0">0</button><button data-k=".">.</button>
      <button class="op" data-k="−">−</button>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
// ── 線條圖示（24×24） ──
const P = {
  dinner:  "M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M18 3c-2.5 1-4 3.5-4 7v3h4M18 3v18",
  lunch:   "M3 11h18M4 11a8 7.5 0 0 0 16 0M9 21h6M9 7.5 20 5M9 4.5 20 3",
  bfast:   "M6 10.5A3.5 3.5 0 0 1 7 4h10a3.5 3.5 0 0 1 1 6.5V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1z",
  drink:   "M4 9h12v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM16 11h1.5a2.5 2.5 0 0 1 0 5H16M8 3v3M12 3v3",
  snack:   "M12 3a9 9 0 1 0 9 9 4 4 0 0 1-5-5 4 4 0 0 1-4-4zM8.5 10.5h.01M9 15.5h.01M14 16h.01",
  bus:     "M7 3h10a3 3 0 0 1 3 3v11H4V6a3 3 0 0 1 3-3zM4 11h16M7 17v3M17 17v3M8 14h.01M16 14h.01",
  bag:     "M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2",
  cart:    "M3 4h2.5l2.2 11h10.1L20 7.5H6.3M9 20h.01M17 20h.01",
  home:    "M4 11l8-7 8 7v9h-5v-5H9v5H4z",
  game:    "M7 8h10a5 5 0 0 1 5 5v1a3 3 0 0 1-5.3 2L15 14H9l-1.7 2A3 3 0 0 1 2 14v-1a5 5 0 0 1 5-5zM7 10.5v4M5 12.5h4M16 12h.01M18.5 13.5h.01",
  med:     "M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM12 8v8M8 12h8",
  book:    "M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5",
  phone:   "M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM11 18h2",
  gift:    "M3 8h18v4H3zM5 12h14v9H5zM12 8v13M12 8C10 4 6 4 6 6.3S9.5 8 12 8zM12 8c2-4 6-4 6-1.7S14.5 8 12 8z",
  more:    "M5 12h.01M12 12h.01M19 12h.01",
  salary:  "M3 7h18v13H3zM8 7V4h8v3M3 12.5h18",
  bonus:   "M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M10 17h4v4",
  pocket:  "M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM14.5 9H11a1.5 1.5 0 0 0 0 3h2a1.5 1.5 0 0 1 0 3H9.5M12 7v10",
  invest:  "M3 20h18M5 16l5-5 3 3 6-7M15 7h4v4",
  redenv:  "M6 3h12a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM5 8l7 4 7-4M12 15h.01",
  refund:  "M4 10a8 8 0 1 1 1.5 6M4 4v6h6",
  back:    "M15 5l-7 7 7 7",
  trash:   "M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3",
  left:    "M15 5l-7 7 7 7",
  right:   "M9 5l7 7-7 7",
  cal:     "M4 6h16v14H4zM4 10h16M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01",
  del:     "M9 6h11v12H9l-6-6zM12 10l4 4M16 10l-4 4"
};
const svg = (k, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${["more"].includes(k) ? 3.2 : w}" stroke-linecap="round" stroke-linejoin="round"><path d="${P[k]}"/></svg>`;

const CATS = {
  out: [["早餐","bfast"],["午餐","lunch"],["晚餐","dinner"],["飲品","drink"],["點心","snack"],["交通","bus"],["購物","bag"],["日用品","cart"],
        ["房租","home"],["娛樂","game"],["醫療","med"],["學習","book"],["通訊","phone"],["禮物","gift"],["其他","more"]],
  in:  [["薪水","salary"],["獎金","bonus"],["零用錢","pocket"],["投資","invest"],["紅包","redenv"],["退款","refund"],["其他","more"]]
};
// 舊版分類名稱也給圖示
const LEGACY = { "餐飲": "dinner", "居家": "home" };
const iconOf = (cat) => svg((CATS.out.concat(CATS.in).find((c) => c[0] === cat) || [0, LEGACY[cat] || "more"])[1]);

const KEY = "wallet-records-v1";
const $ = (id) => document.getElementById(id);
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(records)); } catch { toast("儲存失敗，請檢查瀏覽器設定"); } }

let records = load();
let view = new Date(); view.setDate(1);
let form = { type: "out", cat: "早餐", id: null, date: "" };

const money = (n) => "$" + (Math.round(n * 100) / 100).toLocaleString("zh-TW", { maximumFractionDigits: 2 });
const pad2 = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const WEEK = "日一二三四五六";

function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); }
function escapeHtml(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// ── 主畫面 ──
function render() {
  const ym = `${view.getFullYear()}-${pad2(view.getMonth()+1)}`;
  $("monthLabel").textContent = `${view.getFullYear()} 年 ${view.getMonth()+1} 月`;
  const rows = records.filter((r) => r.date.startsWith(ym)).sort((a, b) => b.date.localeCompare(a.date) || b.ts - a.ts);
  const inc = rows.filter((r) => r.type === "in").reduce((s, r) => s + r.amount, 0);
  const exp = rows.filter((r) => r.type === "out").reduce((s, r) => s + r.amount, 0);
  $("balance").textContent = (inc - exp < 0 ? "-" : "") + money(Math.abs(inc - exp));
  $("incomeSum").textContent = money(inc);
  $("expenseSum").textContent = money(exp);

  const byCat = {};
  rows.filter((r) => r.type === "out").forEach((r) => byCat[r.cat] = (byCat[r.cat] || 0) + r.amount);
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const max = cats.length ? cats[0][1] : 1;
  $("catPanel").innerHTML = cats.length
    ? cats.map(([c, v]) => `<div class="cat-row"><span class="emo">${iconOf(c)}</span><span class="name">${c}</span>
        <span class="bar"><i style="width:${(v / max * 100).toFixed(1)}%"></i></span><span class="amt">${money(v)}</span></div>`).join("")
    : `<div class="empty" style="padding:10px 0">這個月還沒有支出</div>`;

  if (!rows.length) {
    $("list").innerHTML = `<div class="panel empty"><img src="icons/icon-192.png" alt="">錢包空空的，按下方金幣記第一筆吧！</div>`;
    return;
  }
  const groups = {};
  rows.forEach((r) => (groups[r.date] = groups[r.date] || []).push(r));
  $("list").innerHTML = Object.entries(groups).map(([d, items]) => {
    const dt = parse(d);
    const net = items.reduce((s, r) => s + (r.type === "in" ? r.amount : -r.amount), 0);
    return `<div class="day"><div class="day-head"><span>${dt.getMonth()+1}/${dt.getDate()}（${WEEK[dt.getDay()]}）</span>
      <span>${net >= 0 ? "+" : "-"}${money(Math.abs(net))}</span></div><div class="panel" style="padding:4px 14px">` +
      items.map((r) => `<button class="item ${r.type}" data-id="${r.id}"><span class="coin">${iconOf(r.cat)}</span>
        <span class="info"><b>${r.cat}</b>${r.note ? `<small>${escapeHtml(r.note)}</small>` : ""}</span>
        <span class="money">${r.type === "in" ? "+" : "-"}${money(r.amount)}</span></button>`).join("") + `</div></div>`;
  }).join("");
}

// ── 計算機 ──
let expr = "";
const OPS = "+−×÷";
function calc(s) {
  const toks = s.match(/\d*\.?\d+|\d+\.|[+−×÷]/g);
  if (!toks) return 0;
  while (toks.length && OPS.includes(toks[toks.length - 1])) toks.pop();
  if (!toks.length) return 0;
  const terms = [parseFloat(toks[0])];
  for (let i = 1; i < toks.length; i += 2) {
    const op = toks[i], n = parseFloat(toks[i + 1]);
    if (op === "×") terms.push(terms.pop() * n);
    else if (op === "÷") terms.push(n === 0 ? NaN : terms.pop() / n);
    else terms.push(op === "+" ? n : -n);
  }
  return Math.round(terms.reduce((a, b) => a + b, 0) * 100) / 100;
}
function showExpr() {
  const v = calc(expr);
  $("expr").textContent = /[+−×÷]/.test(expr) ? expr : "";
  $("amt").textContent = isFinite(v) ? money(v) : "無法計算";
}
function press(k) {
  const last = expr.slice(-1);
  const cur = expr.split(/[+−×÷]/).pop();
  if (k === "ok") return submit();
  if (k === "AC") expr = "";
  else if (k === "back") expr = expr.slice(0, -1);
  else if (OPS.includes(k)) { if (!expr) return; expr = OPS.includes(last) ? expr.slice(0, -1) + k : expr + k; }
  else if (k === ".") { if (!cur.includes(".")) expr += cur ? "." : "0."; }
  else {
    if (cur.includes(".") && cur.split(".")[1].length >= 2) return;
    if (cur.replace(".", "").length >= 9) return;
    if (cur === "0") { expr = expr.slice(0, -1); if (k === "00") k = "0"; }
    expr += (k === "00" && !cur) ? "0" : k;
  }
  showExpr();
}

// ── 日期列 ──
function showDate() {
  const d = parse(form.date);
  const diff = Math.round((d - parse(today())) / 864e5);
  const tag = { 0: "今日", "-1": "昨日", "-2": "前天", 1: "明日" }[diff] || "";
  $("dateLabel").innerHTML = `${svg("cal")}${tag ? tag + " " : ""}${d.getFullYear()}/${pad2(d.getMonth()+1)}/${pad2(d.getDate())} 星期${WEEK[d.getDay()]}`;
  $("date").value = form.date;
}
function shiftDay(n) { const d = parse(form.date); d.setDate(d.getDate() + n); form.date = ymd(d); showDate(); }

// ── 分類與常用備註 ──
function renderCats() {
  $("cats").innerHTML = CATS[form.type].map(([n, k]) =>
    `<button data-c="${n}" class="${n === form.cat ? "on" : ""}"><span class="ic">${svg(k, 1.8)}</span>${n}</button>`).join("");
  document.querySelectorAll("#seg button").forEach((b) => b.classList.toggle("on", b.dataset.t === form.type));
  $("selIc").innerHTML = iconOf(form.cat);
  const notes = [];
  records.filter((r) => r.type === form.type && r.cat === form.cat && r.note).sort((a, b) => b.ts - a.ts)
    .forEach((r) => { if (!notes.includes(r.note) && notes.length < 8) notes.push(r.note); });
  $("chips").innerHTML = notes.map((n) => `<button>${escapeHtml(n)}</button>`).join("");
  $("chips").style.display = notes.length ? "" : "none";
}

function openAdd(rec) {
  if (rec) { form = { type: rec.type, cat: rec.cat, id: rec.id, date: rec.date }; expr = String(rec.amount); $("note").value = rec.note || ""; }
  else { form = { type: "out", cat: CATS.out[0][0], id: null, date: today() }; expr = ""; $("note").value = ""; }
  $("delBtn").style.visibility = rec ? "visible" : "hidden";
  renderCats(); showExpr(); showDate();
  $("add").classList.add("open"); $("add").setAttribute("aria-hidden", "false");
  $("cats").scrollTop = 0;
}
function closeAdd() { $("add").classList.remove("open"); $("add").setAttribute("aria-hidden", "true"); document.activeElement.blur(); }

function submit() {
  const amount = calc(expr);
  if (!isFinite(amount)) { toast("算式有誤，不能除以 0"); return; }
  if (!(amount > 0)) { toast("請先輸入金額"); return; }
  const data = { type: form.type, cat: form.cat, amount, date: form.date || today(), note: $("note").value.trim() };
  if (form.id) Object.assign(records.find((r) => r.id === form.id), data);
  else records.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: Date.now(), ...data });
  save();
  const d = parse(data.date); view = new Date(d.getFullYear(), d.getMonth(), 1);
  render(); closeAdd(); toast(form.id ? "已更新" : "存好了");
}

// ── 事件 ──
$("backBtn").innerHTML = svg("back", 2.4);
$("delBtn").innerHTML = svg("trash");
$("dayPrev").innerHTML = svg("left", 3);
$("dayNext").innerHTML = svg("right", 3);
$("backKey").innerHTML = svg("del", 2.2);

$("addBtn").onclick = () => openAdd();
$("backBtn").onclick = closeAdd;
$("seg").onclick = (e) => { const t = e.target.dataset.t; if (!t || t === form.type) return; form.type = t; form.cat = CATS[t][0][0]; renderCats(); };
$("cats").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; form.cat = b.dataset.c; renderCats(); };
$("chips").onclick = (e) => { const b = e.target.closest("button"); if (b) $("note").value = b.textContent; };
$("note").addEventListener("keydown", (e) => { if (e.key === "Enter") e.target.blur(); });
$("pad").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) press(b.dataset.k); });
$("dayPrev").onclick = () => shiftDay(-1);
$("dayNext").onclick = () => shiftDay(1);
$("date").addEventListener("change", (e) => { if (e.target.value) { form.date = e.target.value; showDate(); } });
$("list").onclick = (e) => { const b = e.target.closest(".item"); if (b) openAdd(records.find((r) => r.id === b.dataset.id)); };
$("delBtn").onclick = () => {
  if (!confirm("確定要刪除這筆嗎？")) return;
  records = records.filter((r) => r.id !== form.id); save(); render(); closeAdd(); toast("已刪除");
};

$("prev").onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
$("next").onclick = () => { view.setMonth(view.getMonth() + 1); render(); };

$("menuBtn").onclick = (e) => { e.stopPropagation(); $("menu").classList.toggle("show"); };
document.addEventListener("click", () => $("menu").classList.remove("show"));
$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(records, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `小錢包備份-${today()}.json`; a.click();
  toast("備份已下載");
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw 0;
    const ids = new Set(records.map((r) => r.id));
    records = records.concat(data.filter((r) => r && r.id && !ids.has(r.id) && r.amount > 0 && r.date));
    save(); render(); toast("匯入完成");
  } catch { toast("檔案格式不對"); }
  e.target.value = "";
};
$("clearBtn").onclick = () => { if (confirm("真的要清除全部紀錄嗎？這個動作無法復原。")) { records = []; save(); render(); toast("已清除"); } };

render();
setTimeout(() => $("splash").classList.add("hide"), 1400);

// 有新版就自動換上並重新整理
if ("serviceWorker" in navigator) {
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!reloaded) { reloaded = true; location.reload(); } });
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((r) => r.update()).catch(() => {});
}
</script>
</body>
</html>
