<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小錢包記帳</title>
<meta name="theme-color" content="#FAF6ED">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小錢包">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #FAF6ED;
    --card: #FFFFFF;
    --ink: #2F3E5C;
    --muted: #8A8F9C;
    --line: #3E5A8C;
    --blue: #9DB4E0;
    --blue-soft: #DCE5F5;
    --orange: #F2A365;
    --orange-deep: #E5814F;
    --gold: #E9B65C;
    --silver: #D9D6D0;
    --income: #4E8E6E;
    --expense: #D9664A;
    --radius: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  body { min-height: 100vh; padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 110px); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 0 16px; }

  /* 開啟畫面：跟圖示一樣的錢包 */
  #splash { position: fixed; inset: 0; z-index: 99; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity .5s ease, visibility .5s; }
  #splash img { width: min(78vw, 360px); animation: float 1.6s ease-in-out infinite; }
  #splash h1 { position: relative; margin: 6px 0 0; font-size: 26px; letter-spacing: 4px; color: var(--line); }
  #splash p { margin: 8px 0 0; color: var(--muted); font-size: 14px; letter-spacing: 2px; }
  #splash.hide { opacity: 0; visibility: hidden; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }

  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 10px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 19px; color: var(--line); }
  .brand img { width: 38px; height: 38px; border-radius: 11px; box-shadow: 0 2px 6px rgba(62,90,140,.15); }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
    background: var(--card); box-shadow: 0 1px 4px rgba(62,90,140,.12); font-size: 18px; }

  .month { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 4px 0 14px; font-weight: 600; }
  .month button { width: 32px; height: 32px; border-radius: 50%; font-size: 18px; color: var(--line); background: var(--blue-soft); }

  /* 錢包造型的總覽卡 */
  .wallet { position: relative; background: var(--blue); border: 2.5px solid var(--line); border-radius: var(--radius);
    padding: 20px 20px 18px; color: #fff; overflow: hidden; }
  .wallet::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 14px; background: var(--orange); border-bottom: 2.5px solid var(--line); }
  .wallet .clasp { position: absolute; right: -2px; top: 50%; transform: translateY(-50%); width: 46px; height: 34px;
    background: var(--blue); border: 2.5px solid var(--line); border-right: 0; border-radius: 18px 0 0 18px; }
  .wallet .clasp::after { content: ""; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    width: 12px; height: 12px; border-radius: 50%; background: var(--orange); border: 2px solid var(--line); }
  .wallet .label { margin-top: 10px; font-size: 13px; opacity: .9; color: var(--ink); }
  .wallet .balance { font-size: 36px; font-weight: 800; color: var(--ink); margin: 2px 0 14px; letter-spacing: .5px; }
  .pocket { display: flex; gap: 10px; margin-right: 40px; }
  .pocket div { flex: 1; background: var(--orange); border: 2px solid var(--line); border-radius: 14px; padding: 9px 12px; color: var(--ink); }
  .pocket small { font-size: 12px; display: block; opacity: .85; }
  .pocket b { font-size: 17px; }

  h2 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 24px 4px 10px; }
  .panel { background: var(--card); border-radius: var(--radius); padding: 14px 16px; box-shadow: 0 1px 6px rgba(62,90,140,.08); }

  .cat-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .cat-row .emo { width: 30px; display: grid; place-items: center; color: var(--line); }
  .cat-row .emo svg { width: 22px; height: 22px; }
  .cat-row .name { width: 52px; font-size: 14px; }
  .bar { flex: 1; height: 10px; background: var(--blue-soft); border-radius: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--orange); border-radius: 6px; }
  .cat-row .amt { width: 82px; text-align: right; font-size: 14px; font-variant-numeric: tabular-nums; }

  .day { margin-bottom: 12px; }
  .day-head { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 0 6px 6px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid #F1ECE2; width: 100%; text-align: left; }
  .item:last-child { border-bottom: 0; }
  .coin { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--line);
    background: #FBE7C8; border: 2px solid var(--gold); }
  .item.in .coin { background: #E2EDE4; border-color: #9BC3A9; }
  .item .info { flex: 1; min-width: 0; }
  .item .info b { font-weight: 600; font-size: 15px; display: block; }
  .item .info small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .item .money { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--expense); }
  .item.in .money { color: var(--income); }

  .empty { text-align: center; color: var(--muted); padding: 26px 0 14px; font-size: 14px; }
  .empty img { width: 120px; opacity: .85; display: block; margin: 0 auto 6px; }

  /* 金幣新增按鈕 */
  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 24px);
    width: 68px; height: 68px; border-radius: 50%; background: var(--gold); border: 3px solid #C8923A;
    box-shadow: 0 6px 16px rgba(201,146,58,.4), inset 0 0 0 5px #F3CF86; font-size: 34px; color: #8A5A16; font-weight: 700; z-index: 10; }
  .fab:active { transform: translateX(-50%) scale(.94); }

  .coin svg { width: 22px; height: 22px; }

  /* ── 記一筆：整頁 ── */
  .add { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform .3s ease; visibility: hidden; }
  .add.open { transform: none; visibility: visible; }
  .add > * { width: 100%; }
  .topbar, .cats { padding-left: max(14px, calc(50% - 280px)) !important; padding-right: max(14px, calc(50% - 280px)) !important; }
  .entry > *, .keys-area > * { max-width: 560px; margin-left: auto; margin-right: auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: calc(env(safe-area-inset-top) + 10px) 14px 10px; border-bottom: 1px solid #ECE5D8; }
  .topbar .tb { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: var(--ink); }
  .topbar .tb svg { width: 24px; height: 24px; }
  .topbar .tb.trash { color: var(--expense); }
  .seg { display: flex; border: 2.5px solid var(--ink); border-radius: 14px; padding: 3px; background: #fff; }
  .seg button { width: 88px; padding: 6px 0; border-radius: 10px; font-weight: 700; font-size: 17px; letter-spacing: 2px; }
  .seg button.on { background: var(--orange); }

  .cats { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(4, 1fr); align-content: start;
    gap: 4px 0; padding: 14px 10px; -webkit-overflow-scrolling: touch; }
  .cats button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; font-size: 14px; color: var(--ink); }
  .ic { position: relative; width: 40px; height: 40px; display: grid; place-items: center; }
  .ic svg { position: relative; z-index: 1; width: 34px; height: 34px; }
  .ic::before { content: ""; position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--orange); transform: scale(0); transition: transform .15s; z-index: 0; opacity: .85; }
  .on .ic::before, .ic.dot::before { transform: scale(1); }
  .ic[style*="--dot"]::before { background: var(--dot); }
  .cats button.on { font-weight: 700; }

  /* 下方輸入區 */
  .entry { border-top: 2.5px solid var(--ink); background: #fff; }
  .amt-row { display: flex; align-items: center; min-height: 66px; padding: 6px 14px; gap: 10px; }
  .amt-row .ic svg { width: 30px; height: 30px; }
  .amt-box { flex: 0 0 46%; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .amt-box .expr { font-size: 13px; color: var(--muted); min-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .amt-box b { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .amt-row .divider { width: 1.5px; align-self: stretch; background: #E4DDD0; margin: 4px 0; }
  .amt-row input { flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 17px; color: var(--ink); background: none; padding: 8px 0; }
  .amt-row input::placeholder { color: #B5B2AB; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 14px 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; background: #F1ECE2; border-radius: 16px; padding: 6px 14px; font-size: 14px; max-width: 200px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .keys-area { background: #F7CFA3; border-top: 2.5px solid var(--ink); padding: 12px 12px calc(env(safe-area-inset-bottom) + 14px); }
  .datebar { position: relative; display: flex; align-items: center; justify-content: space-between; background: #fff;
    border: 2.5px solid var(--ink); border-radius: 26px; height: 46px; margin-bottom: 12px; }
  .datebar .arrow { width: 50px; height: 100%; display: grid; place-items: center; position: relative; z-index: 2; }
  .datebar .arrow svg { width: 22px; height: 22px; }
  .datebar .label { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
  .datebar .label svg { width: 22px; height: 22px; }
  .datebar input[type=date] { position: absolute; left: 50px; right: 50px; top: 0; bottom: 0; opacity: 0; width: calc(100% - 100px);
    height: 100%; z-index: 1; -webkit-appearance: none; appearance: none; }
  .pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
  .pad button { height: clamp(50px, 7.6vh, 68px); border-radius: 999px; background: #fff; border: 2.5px solid var(--ink);
    font-size: 24px; font-weight: 600; color: var(--ink); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .pad button svg { width: 24px; height: 24px; vertical-align: middle; }
  .pad .op { background: var(--blue); color: #fff; font-size: 27px; }
  .pad .ok { grid-row: span 2; height: auto; background: var(--orange-deep); color: #fff; font-size: 24px; letter-spacing: 1px; }
  .pad button:active { filter: brightness(.9); transform: scale(.95); }

  /* ── 分析頁 ── */
  .hdr-btns { display: flex; gap: 10px; }
  .icon-btn svg { width: 20px; height: 20px; color: var(--line); }
  .see-more { float: right; font-size: 13px; color: var(--line); font-weight: 600; }
  .ana { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform .3s ease; visibility: hidden; }
  .ana.open { transform: none; visibility: visible; }
  .ana .seg button { width: 104px; font-size: 15px; letter-spacing: 1px; }
  .ana-body { flex: 1; overflow-y: auto; padding: 14px max(16px, calc(50% - 280px)) calc(env(safe-area-inset-bottom) + 30px); -webkit-overflow-scrolling: touch; }
  .ana-body .month { margin-top: 0; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: #fff; border-radius: 18px; padding: 12px 14px; box-shadow: 0 1px 6px rgba(62,90,140,.08); }
  .tile small { display: block; font-size: 12px; color: var(--muted); }
  .tile b { font-size: 21px; font-variant-numeric: tabular-nums; }
  .tile .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: 0; }
  .hero { background: #fff; border-radius: 22px; padding: 16px 18px; box-shadow: 0 1px 6px rgba(62,90,140,.08); }
  .hero small { font-size: 13px; color: var(--muted); }
  .hero .big { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 2px 0 6px; }
  .hero .sub { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .hero .sub b { color: var(--ink); }
  .chg-up { color: var(--expense); font-weight: 700; }
  .chg-down { color: var(--income); font-weight: 700; }
  .chart-card { background: #fff; border-radius: 22px; padding: 14px 12px 10px; box-shadow: 0 1px 6px rgba(62,90,140,.08); }
  .legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); padding: 0 4px 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }
  .readout { min-height: 40px; padding: 2px 4px 8px; font-size: 13px; color: var(--muted); }
  .readout b { color: var(--ink); font-size: 15px; }
  .chart-card svg { display: block; width: 100%; height: auto; }
  .chart-card svg text { font-size: 10px; fill: var(--muted); font-family: inherit; }
  table.mt { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  table.mt th { font-weight: 600; color: var(--muted); font-size: 12px; text-align: right; padding: 6px 4px; }
  table.mt td { text-align: right; padding: 9px 4px; border-top: 1px solid #F1ECE2; }
  table.mt th:first-child, table.mt td:first-child { text-align: left; }
  table.mt td.neg { color: var(--expense); }
  table.mt tr.sel td { background: #FDF3E8; }
  .crow { width: 100%; text-align: left; display: block; padding: 11px 0; border-top: 1px solid #F1ECE2; }
  .crow:first-child { border-top: 0; }
  .crow .top { display: flex; align-items: center; gap: 10px; }
  .crow .top .emo { width: 28px; display: grid; place-items: center; color: var(--line); }
  .crow .top .emo svg { width: 22px; height: 22px; }
  .crow .top .nm { flex: 1; font-weight: 600; font-size: 15px; }
  .crow .top .pct { color: var(--muted); font-size: 13px; width: 46px; text-align: right; }
  .crow .top .am { font-weight: 700; width: 86px; text-align: right; font-variant-numeric: tabular-nums; }
  .crow .bar { margin: 7px 0 4px 38px; }
  .crow .meta { margin-left: 38px; font-size: 12px; color: var(--muted); }
  .crow .detail { display: none; margin: 8px 0 0 38px; background: #FAF6ED; border-radius: 12px; padding: 4px 12px; }
  .crow.open .detail { display: block; }
  .drow { display: flex; gap: 10px; font-size: 13px; padding: 7px 0; border-top: 1px dashed #E6DFD2; }
  .drow:first-child { border-top: 0; }
  .drow .d { color: var(--muted); width: 44px; flex: none; }
  .drow .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drow .a { font-variant-numeric: tabular-nums; }

  /* ── 主畫面（新版） ── */
  .mbar { position: relative; display: flex; align-items: center; justify-content: space-between; height: 58px;
    margin: 0 -16px; padding: 0 12px; border-bottom: 1px solid #ECE5D8; }
  .mbar .lg { display: flex; align-items: center; gap: 8px; }
  .tb2 { width: 42px; height: 42px; display: grid; place-items: center; color: var(--ink); }
  .tb2 svg { width: 26px; height: 26px; }
  .streak { display: flex; align-items: center; gap: 3px; background: #F1ECE2; border-radius: 16px; padding: 5px 10px 5px 7px;
    font-weight: 700; font-size: 15px; }
  .streak svg { width: 18px; height: 18px; color: var(--orange-deep); }
  .mpick { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px;
    font-weight: 700; font-size: 19px; white-space: nowrap; }
  .mpick svg { width: 14px; height: 14px; }
  .mpick input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; -webkit-appearance: none; appearance: none; }
  .sums { display: flex; justify-content: space-between; padding: 18px 2px 0; }
  .sum { display: flex; flex-direction: column; gap: 6px; text-align: left; }
  .sum.r { align-items: flex-end; text-align: right; }
  .sum .lbl { display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: 17px; }
  .sum .lbl span { background: linear-gradient(transparent 68%, var(--orange) 68%); padding: 0 2px; }
  .sum.r .lbl span { background: linear-gradient(transparent 68%, var(--blue) 68%); }
  .sum .lbl svg { width: 14px; height: 14px; }
  .sum b { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .ringbox { position: relative; width: min(64vw, 260px); margin: 16px auto 0; aspect-ratio: 1; touch-action: pan-y; }
  .ringbox svg { width: 100%; height: 100%; display: block; }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .ring-center .cn svg { width: 24px; height: 24px; color: var(--gold); }
  .ring-center .t { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 16px; }
  .ring-center .t button { display: grid; place-items: center; color: var(--ink); }
  .ring-center .t svg { width: 20px; height: 20px; }
  .ring-center b { font-size: clamp(20px, 7vw, 28px); font-weight: 800; font-variant-numeric: tabular-nums; }
  .ring-legend { display: flex; justify-content: center; gap: 16px; font-size: 13px; color: var(--muted); margin: 10px 0 18px; }
  .ring-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; border: 1.5px solid var(--ink); }
  .dcard { background: #fff; border: 2.5px solid var(--ink); border-radius: 20px; margin-bottom: 16px; overflow: hidden; }
  .dcard .dh { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 2.5px solid var(--ink);
    font-weight: 700; font-size: 17px; }
  .dcard .dh .tot { color: var(--orange-deep); font-variant-numeric: tabular-nums; }
  .dcard .dh .tot.pos { color: var(--line); }
  .dcard .item { padding: 13px 16px; border-bottom: 1px solid #EEE8DD; }
  .dcard .item:last-child { border-bottom: 0; }
  .dcard .item .ic svg { width: 30px; height: 30px; }
  .dcard .item.in .ic::before { background: var(--blue); }
  .dcard .item .info b { font-weight: 500; font-size: 16px; }
  .dcard .item .money { color: var(--ink); font-weight: 600; font-size: 16px; }
  .dcard .item.in .money { color: var(--line); }
  .fab { background: var(--orange-deep) !important; border: 2.5px solid var(--ink) !important; box-shadow: 0 4px 12px rgba(47,62,92,.25) !important;
    color: #fff !important; font-size: 40px !important; font-weight: 400 !important; line-height: 1; }
  .menu.left { right: auto; left: 12px; top: 56px; }
  /* ── 分析頁（新版） ── */
  .ana .seg button { width: 74px; font-size: 16px; }
  .ptabs { display: flex; border-top: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink); margin: 0 0 12px; }
  .ptabs button { flex: 1; padding: 10px 0; font-weight: 700; font-size: 16px; }
  .ptabs button.on { background: var(--orange); }
  .pnav { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 17px; margin-bottom: 4px; }
  .pnav button { width: 30px; height: 30px; display: grid; place-items: center; }
  .pnav button svg { width: 16px; height: 16px; }
  .pnav .sp { flex: 1; }
  .pnav .vt { width: 40px; height: 40px; }
  .pnav .vt svg { width: 26px; height: 26px; }
  .donut { position: relative; width: min(74vw, 300px); margin: 6px auto 16px; aspect-ratio: 1; }
  .donut svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .donut path { cursor: pointer; transition: transform .15s; transform-origin: 120px 120px; }
  .donut path.act { transform: scale(1.04); }
  .donut .ctr { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; text-align: center; }
  .donut .ctr small { font-size: 15px; font-weight: 700; }
  .donut .ctr b { font-size: clamp(20px, 7vw, 28px); font-weight: 800; font-variant-numeric: tabular-nums; }
  .donut .ctr span { font-size: 13px; color: var(--muted); }
  .bcard { background: #fff; border: 2.5px solid var(--ink); border-radius: 20px; margin-bottom: 16px; overflow: hidden; }
  .lg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; padding: 16px 18px; }
  .lg-grid div { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; min-width: 0; }
  .lg-grid i { width: 18px; height: 18px; border-radius: 4px; flex: none; border: 1.5px solid var(--ink); }

const today = () => ymd(new Date());
const WEEK = "日一二三四五六";

function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); }
function escapeHtml(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// ── 主畫面 ──
let hide = false; try { hide = localStorage.getItem("wallet-hide") === "1"; } catch {}
const show = (txt) => hide ? "＊＊＊＊" : txt;
function streakDays() {
  const days = new Set(records.map((r) => r.date));
  const d = new Date(); if (!days.has(ymd(d))) d.setDate(d.getDate() - 1);
  let n = 0; while (days.has(ymd(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function ringSvg(inc, exp) {
  const R = 85, C = 2 * Math.PI * R, sw = 34;
  let arcs = "";
  if (!inc && !exp) arcs = `<circle cx="110" cy="110" r="${R}" fill="none" stroke="#EDE7DB" stroke-width="${sw}"/>`;
  else {
    const f = inc ? Math.min(exp / inc, 1) : 1;
    arcs = `<circle cx="110" cy="110" r="${R}" fill="none" stroke="${C_RING_IN}" stroke-width="${sw}"/>`;
    if (f > 0) arcs += `<circle cx="110" cy="110" r="${R}" fill="none" stroke="${C_RING_OUT}" stroke-width="${sw}"
      stroke-dasharray="${(C * f).toFixed(2)} ${C.toFixed(2)}" transform="rotate(-90 110 110)"/>`;
    if (f > 0 && f < 1) [0, f].forEach((t) => { const a = t * 2 * Math.PI - Math.PI / 2;
      arcs += `<line x1="${110 + 68 * Math.cos(a)}" y1="${110 + 68 * Math.sin(a)}" x2="${110 + 102 * Math.cos(a)}" y2="${110 + 102 * Math.sin(a)}" stroke="var(--ink)" stroke-width="2.5"/>`; });
  }
  return arcs + `<circle cx="110" cy="110" r="${R + sw / 2}" fill="none" stroke="var(--ink)" stroke-width="2.5"/>
    <circle cx="110" cy="110" r="${R - sw / 2}" fill="#fff" stroke="var(--ink)" stroke-width="2.5"/>`;
}
const C_RING_OUT = "#F5B57E", C_RING_IN = "#B8C9EA";

function render() {
  const ym = `${view.getFullYear()}-${pad2(view.getMonth()+1)}`;
  $("monthLabel").textContent = `${view.getFullYear()} 年 ${view.getMonth()+1} 月`;
  $("monthInput").value = ym;
  const rows = records.filter((r) => r.date.startsWith(ym)).sort((a, b) => b.date.localeCompare(a.date) || b.ts - a.ts);
  const inc = rows.filter((r) => r.type === "in").reduce((s, r) => s + r.amount, 0);
  const exp = rows.filter((r) => r.type === "out").reduce((s, r) => s + r.amount, 0);
  $("expenseSum").textContent = show(money(exp));
  $("incomeSum").textContent = show(money(inc));
  $("balance").textContent = show((inc - exp < 0 ? "-" : "") + money(Math.abs(inc - exp)));
  $("eyeBtn").innerHTML = svg(hide ? "eyeoff" : "eye");
  $("ring").innerHTML = ringSvg(inc, exp);
  $("ringLegend").innerHTML = !inc && !exp ? "這個月還沒有紀錄"
    : inc ? `<span><i style="background:${C_RING_OUT}"></i>已花 ${Math.round(exp / inc * 100)}%</span>${exp > inc ? `<span class="bad">超支 ${show(money(exp - inc))}</span>` : `<span><i style="background:${C_RING_IN}"></i>還剩 ${Math.round((1 - exp / inc) * 100)}%</span>`}`
    : `<span><i style="background:${C_RING_OUT}"></i>本月還沒有收入</span>`;
  const cum = cumulativeTo(view);
  $("cum").textContent = show((cum < 0 ? "-" : "") + money(Math.abs(cum)));
  const n = streakDays();
  $("streak").hidden = !n;
  $("streak").innerHTML = `${svg("flame")}${n}`;

  if (!rows.length) {
    $("list").innerHTML = miniBudget() + `<div class="dcard empty" style="padding:24px 0"><img src="icons/icon-192.png" alt="">錢包空空的，按下方「＋」記第一筆吧！</div>`;
    return;
  }
  const groups = {};
  rows.forEach((r) => (groups[r.date] = groups[r.date] || []).push(r));
  $("list").innerHTML = miniBudget() + Object.entries(groups).map(([d, items]) => {
    const dt = parse(d);
    const net = items.reduce((s, r) => s + (r.type === "in" ? r.amount : -r.amount), 0);
    return `<div class="dcard"><div class="dh"><span>${dt.getFullYear()}/${pad2(dt.getMonth()+1)}/${pad2(dt.getDate())} 星期${WEEK[dt.getDay()]}</span>
      <span class="tot ${net >= 0 ? "pos" : ""}">${show((net < 0 ? "$-" : "$") + money(Math.abs(net)).slice(1))}</span></div>` +
      items.map((r) => `<button class="item ${r.type}" data-id="${r.id}"><span class="ic dot">${iconOf(r.cat)}</span>
        <span class="info"><b>${r.note ? escapeHtml(r.note) : r.cat}</b></span>
        <span class="money">${show((r.type === "in" ? "$" : "$-") + money(r.amount).slice(1))}</span></button>`).join("") + `</div>`;
  }).join("");
}

// ── 計算機 ──
let expr = "";
const OPS = "+−×÷";
function calc(s) {
  const toks = s.match(/\d*\.?\d+|\d+\.|[+−×÷]/g);
  if (!toks) return 0;
  while (toks.length && OPS.includes(toks[toks.length - 1])) toks.pop();
  if (!toks.length) return 0;
  const terms = [parseFloat(toks[0])];
  for (let i = 1; i < toks.length; i += 2) {
    const op = toks[i], n = parseFloat(toks[i + 1]);
    if (op === "×") terms.push(terms.pop() * n);
    else if (op === "÷") terms.push(n === 0 ? NaN : terms.pop() / n);
    else terms.push(op === "+" ? n : -n);
  }
  return Math.round(terms.reduce((a, b) => a + b, 0) * 100) / 100;
}
function showExpr() {
  const v = calc(expr);
  $("expr").textContent = /[+−×÷]/.test(expr) ? expr : "";
  $("amt").textContent = isFinite(v) ? money(v) : "無法計算";
}
function press(k) {
  const last = expr.slice(-1);
  const cur = expr.split(/[+−×÷]/).pop();
  if (k === "ok") return submit();
  if (k === "AC") expr = "";
  else if (k === "back") expr = expr.slice(0, -1);
  else if (OPS.includes(k)) { if (!expr) return; expr = OPS.includes(last) ? expr.slice(0, -1) + k : expr + k; }
  else if (k === ".") { if (!cur.includes(".")) expr += cur ? "." : "0."; }
  else {
    if (cur.includes(".") && cur.split(".")[1].length >= 2) return;
    if (cur.replace(".", "").length >= 9) return;
    if (cur === "0") { expr = expr.slice(0, -1); if (k === "00") k = "0"; }
    expr += (k === "00" && !cur) ? "0" : k;
  }
  showExpr();
}

function showDate() {
  const d = parse(form.date);
  const diff = Math.round((d - parse(today())) / 864e5);
  const tag = { 0: "今日", "-1": "昨日", "-2": "前天", 1: "明日" }[diff] || "";
  $("dateLabel").innerHTML = `${svg("cal")}${tag ? tag + " " : ""}${d.getFullYear()}/${pad2(d.getMonth()+1)}/${pad2(d.getDate())} 星期${WEEK[d.getDay()]}`;
  $("date").value = form.date;
}
function shiftDay(n) { const d = parse(form.date); d.setDate(d.getDate() + n); form.date = ymd(d); showDate(); }

function renderCats() {
  $("cats").innerHTML = CATS[form.type].map(([n, k]) =>
    `<button data-c="${n}" class="${n === form.cat ? "on" : ""}"><span class="ic">${svg(k, 1.8)}</span>${n}</button>`).join("");
  document.querySelectorAll("#seg button").forEach((b) => b.classList.toggle("on", b.dataset.t === form.type));
  $("selIc").innerHTML = iconOf(form.cat);
  const notes = [];
  records.filter((r) => r.type === form.type && r.cat === form.cat && r.note).sort((a, b) => b.ts - a.ts)
    .forEach((r) => { if (!notes.includes(r.note) && notes.length < 8) notes.push(r.note); });
  $("chips").innerHTML = notes.map((n) => `<button>${escapeHtml(n)}</button>`).join("");
  $("chips").style.display = notes.length ? "" : "none";
}

function openAdd(rec, preset) {
  if (rec) { form = { type: rec.type, cat: rec.cat, id: rec.id, date: rec.date, inv: rec.inv }; expr = String(rec.amount); $("note").value = rec.note || ""; }
  else if (preset) { form = { type: "out", cat: preset.cat, id: null, date: preset.date, inv: preset.inv }; expr = String(preset.amount); $("note").value = preset.note; }
  else { form = { type: "out", cat: CATS.out[0][0], id: null, date: today() }; expr = ""; $("note").value = ""; }
  $("delBtn").style.display = rec ? "" : "none";
  $("scanBtn").style.display = rec ? "none" : "";
  renderCats(); showExpr(); showDate();
  $("add").classList.add("open"); $("add").setAttribute("aria-hidden", "false");
  $("cats").scrollTop = 0;
}
function closeAdd() { $("add").classList.remove("open"); $("add").setAttribute("aria-hidden", "true"); document.activeElement.blur(); }

function submit() {
  const amount = calc(expr);
  if (!isFinite(amount)) { toast("算式有誤，不能除以 0"); return; }
  if (!(amount > 0)) { toast("請先輸入金額"); return; }
  const data = { type: form.type, cat: form.cat, amount, date: form.date || today(), note: $("note").value.trim() };
  if (form.inv) data.inv = form.inv;
  if (form.id) Object.assign(records.find((r) => r.id === form.id), data);
  else records.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: Date.now(), ...data });
  save();
  const d = parse(data.date); view = new Date(d.getFullYear(), d.getMonth(), 1);
  render(); closeAdd(); toast(form.id ? "已更新" : "存好了");
}

// ── 分析 ──
const C_IN = "#5B7BB8", C_OUT = "#E5814F";
const PAL = ["#eb6834", "#2a78d6", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6"], C_OTHER = "#A8A39A";
let ana = { kind: "out", period: "m", anchor: null, chart: "donut", sort: "desc", open: null, act: null, sel: null };
const sum = (rows, t) => rows.filter((r) => r.type === t).reduce((s, r) => s + r.amount, 0);
const ymKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
const short = (n) => n >= 10000 ? (Math.round(n / 1000) / 10) + "萬" : Math.round(n).toLocaleString("zh-TW");
function niceMax(v) { if (v <= 0) return 1000; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
const addM = (d, n) => new Date(d.getFullYear(), d.getMonth() + n, 1);

// 期間：回傳月份清單（第一天）
function periodMonths(anchor, period) {
  if (period === "y") return Array.from({ length: 12 }, (_, i) => new Date(anchor.getFullYear(), i, 1));
  const n = period === "6m" ? 6 : 1;
  return Array.from({ length: n }, (_, i) => addM(anchor, i - n + 1));
}
const prevAnchor = (a, p) => p === "y" ? new Date(a.getFullYear() - 1, a.getMonth(), 1) : addM(a, p === "6m" ? -6 : -1);
function periodLabel(a, p) {
  if (p === "y") return `${a.getFullYear()} 年`;
  if (p === "m") return `${a.getFullYear()} 年 ${a.getMonth() + 1} 月`;
  const s = addM(a, -5); return `${s.getFullYear()}/${s.getMonth() + 1} – ${a.getFullYear()}/${a.getMonth() + 1}`;
}
const inMonths = (ms) => { const keys = new Set(ms.map(ymKey)); return records.filter((r) => keys.has(r.date.slice(0, 7))); };

function openAna(kind, d) {
  ana.kind = kind || "out";
  const base = d || view;
  ana.anchor = new Date(base.getFullYear(), base.getMonth(), 1);
  ana.open = null; ana.act = null; ana.sel = null;
  renderAna();
  $("ana").classList.add("open"); $("ana").setAttribute("aria-hidden", "false");
  $("anaBody").scrollTop = 0;
}
function closeAna() { $("ana").classList.remove("open"); $("ana").setAttribute("aria-hidden", "true"); }

function renderAna() {
  document.querySelectorAll("#anaSeg button").forEach((b) => b.classList.toggle("on", b.dataset.v === ana.kind));
  const head = `
  <div class="ptabs">${[["m", "月"], ["6m", "近 6 個月"], ["y", "年"]].map(([k, t]) => `<button data-p="${k}" class="${ana.period === k ? "on" : ""}">${t}</button>`).join("")}</div>
  <div class="pnav"><button data-nav="-1" aria-label="上一期">${svg("left", 3)}</button><span>${periodLabel(ana.anchor, ana.period)}</span>
    <button data-nav="1" aria-label="下一期">${svg("right", 3)}</button><span class="sp"></span>
    ${ana.kind !== "net" ? `<button class="vt" data-vt="1" aria-label="切換圖表">${svg(ana.chart === "donut" ? "barsico" : "pieico", 2)}</button>` : ""}</div>`;
  $("anaBody").innerHTML = head + (ana.kind === "net" ? netView() : catView2());
}

function catView2() {
  const type = ana.kind, word = type === "out" ? "支出" : "收入";
  const rows = inMonths(periodMonths(ana.anchor, ana.period)).filter((r) => r.type === type);
  const prevRows = inMonths(periodMonths(prevAnchor(ana.anchor, ana.period), ana.period)).filter((r) => r.type === type);
  const total = rows.reduce((s, r) => s + r.amount, 0);
  const by = {};
  rows.forEach((r) => (by[r.cat] = by[r.cat] || []).push(r));
  let cats = Object.entries(by).map(([c, list]) => ({ c, list, v: list.reduce((s, r) => s + r.amount, 0),
    pv: prevRows.filter((r) => r.cat === c).reduce((s, r) => s + r.amount, 0) })).sort((a, b) => b.v - a.v);
  cats.forEach((x, i) => x.color = i < 7 ? PAL[i] : C_OTHER);
  // 圖表用：第 8 名以後合併成「其他（合併）」
  let segs = cats.slice(0, 7);
  if (cats.length > 7) segs.push({ c: "其他（合併）", v: cats.slice(7).reduce((s, x) => s + x.v, 0), color: C_OTHER, merged: true });
  if (!total) return `<div class="bcard empty" style="padding:30px 0">這段期間沒有${word}紀錄</div>`;

  let chart;
  if (ana.chart === "donut") {
    const R1 = 112, R0 = 62, cx = 120, cy = 120;
    let a0 = -Math.PI / 2, paths = "";
    const pt = (r, a) => `${(cx + r * Math.cos(a)).toFixed(2)},${(cy + r * Math.sin(a)).toFixed(2)}`;
    segs.forEach((x) => {
      const ang = x.v / total * Math.PI * 2, a1 = a0 + ang;
      if (segs.length === 1) {
        paths += `<path data-seg="${x.c}" d="M${pt(R1, -Math.PI/2)}A${R1},${R1} 0 1 1 ${pt(R1, Math.PI*1.5 - 0.0001)}ZM${pt(R0, -Math.PI/2)}A${R0},${R0} 0 1 0 ${pt(R0, Math.PI*1.5 - 0.0001)}Z" fill-rule="evenodd" fill="${x.color}" stroke="var(--ink)" stroke-width="2.5"/>`;
      } else {
        const big = ang > Math.PI ? 1 : 0;
        paths += `<path data-seg="${x.c}" class="${ana.act === x.c ? "act" : ""}" d="M${pt(R1, a0)}A${R1},${R1} 0 ${big} 1 ${pt(R1, a1)}L${pt(R0, a1)}A${R0},${R0} 0 ${big} 0 ${pt(R0, a0)}Z"
          fill="${x.color}" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>`;
      }
      a0 = a1;
    });
    const act = segs.find((x) => x.c === ana.act);
    chart = `<div class="donut"><svg viewBox="0 0 240 240" role="img" aria-label="${word}分類圓餅圖">${paths}</svg>
      <div class="ctr">${act ? `<small>${act.c}</small><b>${money(act.v)}</b><span>${(act.v / total * 100).toFixed(1)}%</span>`
        : `<small>總${word}</small><b>${money(total)}</b>`}</div></div>`;
  } else {
    const max = cats[0].v;
    chart = `<div class="bcard"><div class="bh">總${word}　${money(total)}</div><div class="hbars">${cats.map((x) =>
      `<div class="hb"><span class="n">${x.c}</span><span class="t"><i style="width:${(x.v / max * 100).toFixed(1)}%;background:${x.color}"></i></span><span class="v">${money(x.v)}</span></div>`).join("")}</div></div>`;
  }
  const legend = ana.chart === "donut" ? `<div class="bcard"><div class="lg-grid">${segs.map((x) =>
    `<div><i style="background:${x.color}"></i><span>${x.c}</span><em>${(x.v / total * 100).toFixed(1)}%</em></div>`).join("")}</div></div>` : "";

  const list = [...cats].sort((a, b) => ana.sort === "desc" ? b.v - a.v : a.v - b.v);
  const chg = (x) => {
    const d = x.v - x.pv;
    if (!x.pv) return `<small class="flat">上期沒有</small>`;
    if (!d) return `<small class="flat">和上期一樣</small>`;
    const goodDir = type === "out" ? d < 0 : d > 0;
    return `<small class="${goodDir ? "good" : "bad"}">${d > 0 ? "↑" : "↓"} ${money(Math.abs(d))}</small>`;
  };
  const detail = `<div class="bcard"><div class="bh"><span>${word}明細</span>

function netView() {
  const ms = ana.period === "m" ? periodMonths(ana.anchor, "6m") : periodMonths(ana.anchor, ana.period);
  const data = ms.map((d) => { const rows = inMonths([d]); return { d, n: rows.length, inc: sum(rows, "in"), exp: sum(rows, "out") }; });
  const focus = ana.period === "m" ? data.filter((x) => ymKey(x.d) === ymKey(ana.anchor)) : data;
  const ti = focus.reduce((s, x) => s + x.inc, 0), te = focus.reduce((s, x) => s + x.exp, 0);
  if (ana.sel === null || ana.sel >= data.length) ana.sel = data.length - 1;
  const max = niceMax(Math.max(...data.map((m) => Math.max(m.inc, m.exp))));
  const W = 340, H = 170, L = 34, B = 20, T = 8, gw = (W - L) / data.length, bw = Math.min(14, gw / 2 - 2);
  const yy = (v) => T + (H - T - B) * (1 - v / max);
  const bar = (x, v, c) => { if (v <= 0) return ""; const top = yy(v), h = (H - B) - top, r = Math.min(3, h);
    return `<path d="M${x},${H - B}V${top + r}q0,-${r} ${r},-${r}h${bw - 2 * r}q${r},0 ${r},${r}V${H - B}z" fill="${c}"/>`; };
  let g = "";
  [0, 0.5, 1].forEach((f) => { const v = max * f, yv = yy(v);
    g += `<line x1="${L}" x2="${W}" y1="${yv}" y2="${yv}" stroke="${f ? "#EFEAE0" : "#C9C3B8"}"/><text x="${L - 5}" y="${yv + 3.5}" text-anchor="end">${short(v)}</text>`; });
  data.forEach((m, i) => {
    const x0 = L + gw * i, cx = x0 + gw / 2;
    if (i === ana.sel) g += `<rect x="${x0 + 1}" y="${T}" width="${gw - 2}" height="${H - T - B}" rx="6" fill="#FDF0E3"/>`;
    g += bar(cx - bw - 1, m.inc, C_IN) + bar(cx + 1, m.exp, C_OUT);
    g += `<text x="${cx}" y="${H - 6}" text-anchor="middle" ${i === ana.sel ? 'style="fill:var(--ink);font-weight:700"' : ""}>${m.d.getMonth() + 1}月</text>`;
    g += `<rect data-m="${i}" x="${x0}" y="0" width="${gw}" height="${H}" fill="transparent"/>`;
  });
  const s = data[ana.sel], net = s.inc - s.exp, nn = ti - te, cumEnd = cumulativeTo(ana.anchor);
  const sign = (v) => (v < 0 ? "-" : "") + money(Math.abs(v));
  return `
  <div class="tiles" style="grid-template-columns:1fr 1fr 1fr">
    <div class="tile"><small><span class="sw" style="background:${C_IN}"></span>收入</small><b style="font-size:17px">${money(ti)}</b></div>
    <div class="tile"><small><span class="sw" style="background:${C_OUT}"></span>支出</small><b style="font-size:17px">${money(te)}</b></div>
    <div class="tile"><small>結餘</small><b style="font-size:17px" class="${nn < 0 ? "bad" : ""}">${sign(nn)}</b></div>
  </div>
  <div class="tile" style="margin-top:10px"><small>累計結餘（到 ${ana.anchor.getFullYear()}/${ana.anchor.getMonth() + 1} 月底，含起始金額 ${money(startBal)}）</small><b class="${cumEnd < 0 ? "bad" : ""}">${sign(cumEnd)}</b></div>
  <h2>${ana.period === "m" ? "近 6 個月比較" : "每月收入與支出"}</h2>
  <div class="chart-card">
    <div class="legend"><span><i style="background:${C_IN}"></i>收入</span><span><i style="background:${C_OUT}"></i>支出</span></div>
    <div class="readout"><b>${s.d.getFullYear()}/${s.d.getMonth() + 1}</b>　收入 <b>${money(s.inc)}</b>　支出 <b>${money(s.exp)}</b>　結餘 <b class="${net < 0 ? "bad" : ""}">${sign(net)}</b></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每月收入與支出長條圖">${g}</svg>
  </div>
  <h2>每月明細表</h2>
  <div class="panel" style="padding:6px 14px">
    <table class="mt"><thead><tr><th>月份</th><th>收入</th><th>支出</th><th>結餘</th><th>累計</th></tr></thead><tbody>
    ${data.map((m, i) => `<tr data-m="${i}" class="${i === ana.sel ? "sel" : ""}"><td>${m.d.getFullYear() !== ana.anchor.getFullYear() ? m.d.getFullYear() + "/" : ""}${m.d.getMonth() + 1} 月</td>

    </tbody></table>
  </div>`;
}

// ── 發票掃描（電子發票證明聯左邊的 QR Code） ──
let scanStream = null, scanTimer = null;
function loadJsQR() {
  if (window.jsQR) return Promise.resolve();
  return new Promise((ok, fail) => { const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
}
function decodeBytes(bytes, enc) {
  try {
    if (enc === "0") return new TextDecoder("big5").decode(bytes);
    const t = new TextDecoder("utf-8").decode(bytes);
    return t;
  } catch { return String.fromCharCode(...bytes); }
}
function parseInvoice(code) {
  const raw = code.binaryData && code.binaryData.length ? Uint8Array.from(code.binaryData) : new TextEncoder().encode(code.data);
  const head = String.fromCharCode(...raw.slice(0, 77));
  if (!/^[A-Z]{2}\d{8}\d{7}/.test(head)) return null;
  const no = head.slice(0, 10);
  const y = +head.slice(10, 13) + 1911, m = head.slice(13, 15), d = head.slice(15, 17);
  const total = parseInt(head.slice(29, 37), 16);
  const latin = String.fromCharCode(...raw);
  const parts = latin.slice(77).split(":");
  const enc = parts[4] || "1";
  let text = decodeBytes(raw.slice(77), enc);
  let segs = text.split(":").slice(5);
  if (enc === "2") { try { segs = new TextDecoder().decode(Uint8Array.from(atob(segs.join(":")), (c) => c.charCodeAt(0))).split(":"); } catch { segs = []; } }
  const items = [];
  for (let i = 0; i + 2 < segs.length; i += 3) { const n = (segs[i] || "").trim(); if (n) items.push(n); }
  if (!(total > 0)) return null;
  return { no, date: `${y}-${m}-${d}`, total, items };
}
function guessCat(items) {
  const t = items.join(" ");
  const rules = [["飲品", /茶|咖啡|拿鐵|奶|飲|可樂|汽水|果汁|水$|豆漿/], ["早餐", /三明治|吐司|蛋餅|漢堡|飯糰|饅頭/],
    ["點心", /餅乾|蛋糕|甜|巧克力|洋芋片|零食|冰|布丁|麵包/], ["交通", /加油|汽油|柴油|停車|悠遊|捷運|高鐵|台鐵|客運/],
    ["日用品", /衛生紙|洗|牙|清潔|電池|垃圾袋|毛巾/], ["醫療", /藥|醫|口罩/], ["通訊", /電信|話費|網路/]];
  if (/便當|飯|麵|餐|鍋|餃|湯|排/.test(t)) return new Date().getHours() < 16 ? "午餐" : "晚餐";
  for (const [c, re] of rules) if (re.test(t)) return c;
  return "其他";
}
function useInvoice(inv) {
  stopScan();
  const go = () => {
    openAdd(null, { amount: inv.total, date: inv.date, note: inv.items.slice(0, 4).join("、").slice(0, 40) || ("發票 " + inv.no), cat: guessCat(inv.items), inv: inv.no });
    toast(`已讀取發票 ${inv.no}，確認後按 OK`);
  };
  if (records.some((r) => r.inv === inv.no) && !confirm(`發票 ${inv.no} 已經記過了，還要再記一次嗎？`)) return;
  go();
}
function tryCode(code) {
  if (!code) return false;
  if (code.data.startsWith("**")) { $("scanMsg").textContent = "這是右邊的 QR Code，請對準左邊那個"; return false; }
  const inv = parseInvoice(code);
  if (!inv) { $("scanMsg").textContent = "這不是電子發票的 QR Code"; return false; }
  useInvoice(inv); return true;
}
async function startScan() {
  $("scan").classList.add("show"); $("scanMsg").textContent = "讀到後會自動帶入金額、日期和品項";
  try { await loadJsQR(); } catch { $("scanMsg").textContent = "需要網路才能掃描，請連上網路再試"; return; }
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 } }, audio: false });
  } catch { $("scanMsg").textContent = "無法開啟相機，可以按「改用拍照」"; return; }
  const v = $("scanVideo"); v.srcObject = scanStream; await v.play().catch(() => {});
  const c = document.createElement("canvas"), ctx = c.getContext("2d", { willReadFrequently: true });
  const tick = () => {
    if (!scanStream) return;
    if (v.videoWidth) {
      const s = Math.min(v.videoWidth, v.videoHeight) * 0.8, sx = (v.videoWidth - s) / 2, sy = (v.videoHeight - s) / 2.4;
      c.width = c.height = 480; ctx.drawImage(v, sx, Math.max(0, sy), s, s, 0, 0, 480, 480);
      const img = ctx.getImageData(0, 0, 480, 480);
      if (tryCode(jsQR(img.data, 480, 480, { inversionAttempts: "dontInvert" }))) return;
    }
    scanTimer = setTimeout(tick, 180);
  };

}
function stopScan() {
  clearTimeout(scanTimer);
  if (scanStream) scanStream.getTracks().forEach((t) => t.stop());
  scanStream = null; $("scan").classList.remove("show");
}
async function scanImageFile(f) {
  try { await loadJsQR(); } catch { toast("需要網路才能辨識"); return; }
  const img = await createImageBitmap(f);
  const c = document.createElement("canvas"), ctx = c.getContext("2d", { willReadFrequently: true });
  const tries = [[0, 0, 1, 1], [0, 0, 0.55, 1], [0, 0, 0.55, 0.6], [0, 0.2, 0.55, 0.6], [0, 0.4, 0.55, 0.6]];
  for (const [x, y, w, h] of tries) {
    const sw = img.width * w, sh = img.height * h, scale = Math.min(1, 1400 / Math.max(sw, sh));
    c.width = sw * scale; c.height = sh * scale;
    ctx.drawImage(img, img.width * x, img.height * y, sw, sh, 0, 0, c.width, c.height);
    const code = jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height);
    if (code && !code.data.startsWith("**")) { if (tryCode(code)) return; }
  }
  toast("讀不到發票的 QR Code，請拍清楚一點再試");
}
$("scanClose").onclick = stopScan;
$("scanPhoto").onclick = () => $("scanFile").click();
$("scanFile").onchange = (e) => { const f = e.target.files[0]; e.target.value = ""; if (f) scanImageFile(f); };
$("qScan").onclick = startScan;
$("cumBtn").onclick = () => toast("從開始記帳一路累積到這個月底的結餘（選單可設定起始金額）");
$("scanBtn").onclick = () => { closeAdd(); startScan(); };
$("qScan").innerHTML = svg("qr", 2) + "掃描發票";
$("qBud").innerHTML = svg("target", 2) + "預算";
$("scanBtn").innerHTML = svg("qr", 2);

render();
setTimeout(() => $("splash").classList.add("hide"), 1400);

// 有新版就自動換上並重新整理
if ("serviceWorker" in navigator) {
  let reloaded = false; const hadOld = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadOld && !reloaded) { reloaded = true; location.reload(); } });
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((r) => r.update()).catch(() => {});
}
</script>
